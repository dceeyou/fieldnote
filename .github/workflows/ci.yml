name: AgriFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: Typecheck, Lint, Unit & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc -b

      - name: ESLint check
        run: npm run lint

      - name: Run unit & integration tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Verify Service Worker precache injection
        run: |
          test -f dist/sw.js
          grep -q "/assets/index-" dist/sw.js
          ! grep -q "exceljs" dist/sw.js

      - name: Upload production dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: agriflow-dist
          path: dist
          retention-days: 3

  e2e-playwright:
    name: Playwright Browser E2E & Offline PWA
    runs-on: ubuntu-latest
    needs: quality-and-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download built dist artifact
        uses: actions/download-artifact@v4
        with:
          name: agriflow-dist
          path: dist

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        run: npm run test:e2e
